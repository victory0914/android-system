# Model profile: Xperia 10 IV (SOG07), Sony, Android 14
#
# STAGE B (2026-09-16): wifi_settings/apn_settings now hold REAL data,
# captured from actual uiautomator dumps
# (tests/fixtures/Xperia 10 IV（SOG07）/*.xml — wifi_list, apn_list,
# apn_entry_{top,middle,bottom}, apn_overflow_menu). See docs/record.md
# and PENDING_REAL_DEVICE_DATA.md for the full account, including what
# this confirms and what's still genuinely unresolved.
#
# wizard_steps below is UNCHANGED Stage A — still 100% invented
# placeholders. No wizard/OOBE data exists or ever will for any model
# (factory reset wipes ADB authorization before the wizard is reachable —
# see docs/record.md's "Wizard capture — RESOLVED AS NOT REMOTELY
# POSSIBLE"), and unlike SHG10 there are no client photos of this
# specific unit's OOBE flow to derive a screen-driven config from either.
model: "Xperia 10 IV"
model_number: "SOG07"
manufacturer: "Sony"
android_version: 14

wizard_steps:
  # TODO(real-device): replace with captured resource-id (language select "Next")
  - screen: "language_select"
    resource_id: "com.google.android.setupwizard:id/next_button"
    action: "tap"
  # TODO(real-device): replace with captured resource-id (terms of service accept)
  - screen: "terms_of_service"
    resource_id: "com.android.setupwizard:id/accept_button"
    action: "tap"
  # TODO(real-device): replace with captured resource-id (skip SIM check) and
  # confirm whether this screen actually appears on this model at all.
  - screen: "skip_sim_check"
    resource_id: "com.android.setupwizard:id/skip_button"
    action: "tap"
    optional: true   # not every model shows this screen
  # TODO(real-device): Android 14 wizard flow may include an extra "Copy apps &
  # data" screen not present on the Android 13 models — confirm and add a step
  # here if so, or remove this placeholder if it turns out not to apply.
  - screen: "skip_copy_apps_data"
    resource_id: "com.android.setupwizard:id/skip_button"
    action: "tap"
    optional: true
  # TODO(real-device): replace with captured resource-id (final "finish setup")
  - screen: "finish_setup"
    resource_id: "com.android.setupwizard:id/finish_button"
    action: "tap"

# RESOLVED (real: tests/fixtures/Xperia 10 IV（SOG07）/wifi_list_SOG07.xml).
# A notable finding in its own right: this screen's ids
# (android:id/switch_widget, android:id/title, the
# com.android.settings:id/settings_button gear icon) are BYTE-IDENTICAL
# to SHG10's (a different manufacturer, SHARP vs. Sony) — this is the
# plain, unskinned AOSP com.android.settings Wi-Fi screen, not an
# OEM-specific one. One real, confirmed difference from SHG10: this
# screen's own title renders via content-desc "インターネット" ("Internet"),
# not "Wi-Fi とモバイルネットワーク" — SHARP's skin apparently renamed it,
# stock Android/Sony didn't.
wifi_settings:
  menu_path:
    - type: text
      value: "設定"
    - type: text
      value: "インターネット"
  # RESOLVED (real) — same id as SHG10, checked="true" in the captured
  # dump. Same safety note applies: check `checked` (wifi_setup.py does,
  # via node_is_checked()) before tapping, never blindly.
  toggle_resource_id: "android:id/switch_widget"
  # RESOLVED (real) — generic AOSP list-item title id, shared by every row
  # on this screen (carrier summary, the Wi-Fi toggle's own label, every
  # scanned SSID — real capture shows earth5_1 among them). Must always be
  # used with `text=<SSID>` to disambiguate.
  network_list_resource_id: "android:id/title"
  # NOT resolved — no dump of the "Connect to network" dialog exists for
  # this unit (same gap SHG10 has for the resource-id fallback; SHG10's
  # actual working path was the *text* "接続" for connect_button_text
  # below, not this field). Kept as the generic AOSP-style placeholder.
  # TODO(real-device): replace with captured resource-id (password entry field
  # in the "Connect to network" dialog)
  password_field_resource_id: "com.android.settings:id/wifi_password"
  # TODO(real-device): replace with captured resource-id (dialog "Connect" button)
  connect_button_resource_id: "com.android.settings:id/wifi_connect_button"
  # INHERITED FROM SHG10, NOT independently confirmed for this unit — no
  # dump of the join-network dialog exists here either. Real evidence
  # elsewhere in this file (identical ids across SHARP/Sony for every
  # OTHER screen checked) makes this a reasoned guess, not a blind one,
  # but it's still unconfirmed for SOG07 specifically.
  connect_button_text: "接続"

# RESOLVED (real: tests/fixtures/Xperia 10 IV（SOG07）/apn_list_SOG07.xml,
# apn_entry_{top,middle,bottom}_SOG07.xml, apn_overflow_menu_SOG07.xml).
# Every id/content-desc/label below is BYTE-IDENTICAL to SHG10's (and to
# SOG08's — see sony_xperia_ace3.yaml) — this is the plain, unskinned AOSP
# com.android.settings APN editor (ApnEditor/ApnSettings), not an
# OEM-specific screen, confirmed now across 3 real devices and 2
# manufacturers. This is materially stronger evidence than SHG07's
# SHG10-inheritance was: that was "same manufacturer, informed guess";
# this is "three independently-dumped real devices, byte-identical
# structure, direct confirmation."
apn_settings:
  # SUPERSEDED (real, 2026-09-18 — see apn_setup.py's _navigate_apn_menu()
  # docstring for the full account, and SHG07's identical note in
  # sharp_aquos_sense6s.yaml): android.settings.APN_SETTINGS reaches a
  # screen that looks like an APN editor but isn't the active SIM's real,
  # live context — confirmed on SHG07 (saves made there never appeared on
  # the APN list reached by manually navigating Settings > Network &
  # internet > SIM > (carrier) > "アクセス ポイント名"). NOT independently
  # confirmed on THIS unit's own hardware — inherited from SOG08's own
  # real confirmation (tests/fixtures/Xperia Ace III（SOG08）/
  # mobile_network_SOG08.xml, 2026-09-18), same manufacturer/lineup, same
  # byte-identical structural pattern already established across every
  # other screen checked for these two Sony models.
  reach_via_wifi_settings_intent: true
  # menu_path now holds ONLY the steps needed AFTER
  # android.settings.WIFI_SETTINGS reaches "インターネット" (this
  # device's real, confirmed combined Wi-Fi/mobile-network screen title —
  # reach_via_wifi_settings_intent above skips the 設定/インターネット
  # text-tap steps that used to manually re-derive that same screen). The
  # gear icon step was already real/confirmed; the final
  # "アクセス ポイント名" tap (WITH a space) is the new step, confirmed
  # real via the SOG08 dump referenced above.
  menu_path:
    - type: resource_id
      value: "com.android.settings:id/settings_button"
    - type: text
      value: "アクセス ポイント名"

  # RESOLVED (real). Every field row shares this one generic id,
  # disambiguated only by visible Japanese label — same pattern as SHG10.
  field_row_resource_id: "android:id/title"
  name_field_label: "名前"
  apn_field_label: "APN"
  # RESOLVED (real) — MCC/MNC rows exist on this build too (captured
  # showing "未設定"/not-yet-set in this particular dump — a blank entry,
  # not evidence they're absent; the fields themselves are real and
  # present). MCC must be exactly 3 digits, MNC 2 or 3 — enforced by
  # apn_setup.py before ever touching the device regardless of model.
  mcc_field_label: "MCC"
  mnc_field_label: "MNC"

  # INHERITED FROM SHG10/SHG07, NOT independently captured for this
  # unit's own per-field dialog — no dump of it open exists for SOG07
  # (same gap that existed for SHG10 until a dedicated capture closed it,
  # and for SHG07, never independently closed at all). Real evidence
  # elsewhere in this file (byte-identical structure across 3 devices for
  # every OTHER screen) makes this a well-reasoned inheritance, not a
  # blind guess — but it remains genuinely unconfirmed for THIS specific
  # dialog. A dedicated dump (open the 名前 field, dump before
  # confirming) would resolve this properly.
  dialog_edit_field_resource_id: "android:id/edit"
  dialog_confirm_button_resource_id: "android:id/button1"
  dialog_cancel_button_resource_id: "android:id/button2"

  # Has no resource-id on this build either (icon-only, standard AOSP
  # Button with no android:id) — confirmed by the real dump, not absence
  # of evidence: apn_list_SOG07.xml shows it exactly like SHG10's did.
  add_button_resource_id: null
  # RESOLVED (real) — "新しい APN" ("New APN"), same content-desc as
  # SHG10/SHG07, sitting immediately left of the "⋮" overflow menu.
  add_button_content_desc: "新しい APN"

  # RESOLVED (real) — same two-tap overflow-menu save flow as SHG10:
  # "その他のオプション" (⋮, no resource-id, content-desc only) then "保存"
  # inside it (shares android:id/title with "キャンセル", disambiguated by
  # text).
  overflow_menu_content_desc: "その他のオプション"
  save_menu_item_text: "保存"
  # Legacy single-button save field — unused now that the real two-tap
  # flow above is resolved. Left null (not deleted) so the field's
  # meaning stays documented, matching SHG10's convention.
  save_button_resource_id: null

  # RESOLVED (real) — a live run on 2026-09-17 showed the same
  # kana-conversion symptom SHG07 had. Coordinate found and confirmed via
  # Pointer Location + a scripted `adb shell input tap` + text-entry test
  # on this exact unit (client-confirmed, see docs/record.md's SOG07
  # section) — must never be copied to another device/resolution. Used
  # for 名前/APN (non-numeric fields).
  keyboard_mode_toggle_tap: [145, 2308]
  # RESOLVED (real, 2026-09-17) — MCC/MNC open a genuinely different
  # numeric-only keypad on this device (confirmed via screenshot: same
  # "あ1"-style toggle key, but at a different X than the text
  # keyboard's). Reusing keyboard_mode_toggle_tap above still produced
  # full-width digits on a real run (client log, 2026-09-17) because it
  # was landing on the wrong key for this keypad — this coordinate is
  # this keypad's own, independently confirmed via the same scripted
  # `adb shell input tap` + text-entry test.
  keyboard_mode_toggle_tap_numeric: [93, 2300]
  # RESOLVED (real, 2026-09-17) — a full automated run still failed MCC
  # identically on all 3 retries even with the numeric toggle coordinate
  # above confirmed and applied. Root cause: on this keypad, the toggle
  # only actually takes effect for `input text`, not for the per-keyevent
  # KEYCODE_<n> mechanism input_digits_direct() normally uses for
  # MCC/MNC (proven correct on SHG10/SHG07, but not here). Switches
  # MCC/MNC to input_text_direct() instead — see _fill_labeled_field()'s
  # docstring in apn_setup.py for the full account.
  use_text_entry_for_numeric: true
  # navigate_up_content_desc left unset here on purpose too — SHG10's
  # real dumps confirm "上へ移動" for that device, and this device's own
  # apn_list_SOG07.xml dump ALSO shows the identical content-desc, so this
  # one IS real, not inherited:
  navigate_up_content_desc: "上へ移動"
