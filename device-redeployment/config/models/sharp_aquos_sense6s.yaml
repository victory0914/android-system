# Model profile: AQUOS sense6s (SHG07), SHARP, Android 13
#
# ⚠️ INHERITED FROM SHG10, NOT INDEPENDENTLY CONFIRMED (2026-09-14) ⚠️
#
# Every value below (except model/model_number/manufacturer/android_version)
# was copied from config/models/sharp_aquos_sense7.yaml (SHG10, AQUOS sense7,
# Android 14) at the client's request, on the reasoning that SHG07 and SHG10
# are the same SHARP AQUOS "sense" lineup and real dumps for SHG07 haven't
# been captured. This is a REASONED STARTING POINT, not a verified one — it
# replaces Stage A's pure invention (values with no basis at all) with
# values that are at least real for a closely related device, but "closely
# related" is not "identical", and this project's own history on SHG10
# itself is the reason for caution here, not just general caution:
#
#   - The APN list screen's title turned out to render differently
#     depending on HOW it was reached (content-desc "アクセスポイント名" via
#     menu navigation vs. content-desc "APN" via the settings intent) — a
#     distinction invisible until a real dump proved it (docs/record.md,
#     2026-09-11).
#   - MCC/MNC digits silently came out full-width instead of half-width via
#     `input text` on this exact device, despite that command being
#     documented Android behavior to bypass the IME entirely — only
#     discovered because the client was watching the real screen
#     (docs/record.md, 2026-09-11).
#   - The per-field dialog's ids were "best-guess standard AOSP" for days
#     before a real dump confirmed them — they happened to be right, but
#     that was confirmed, not assumed.
#
# All of these were found on the SAME physical unit, same Android version,
# same APK builds — just from different screens/paths not yet exercised.
# SHG07 is a different model on a different Android version (13 vs 14),
# which commonly means different Settings/SetupWizard APK builds with their
# own resource-ids, and the setup wizard in particular is known to change
# meaningfully between Android versions (new/removed/reordered OOBE
# screens). Treat every value below as a hypothesis to verify on first real
# contact, not a known-good fact — this is a starting point precisely so
# that if something doesn't match, the failure is loud and specific (a
# tap that finds nothing, a screen that isn't recognized) rather than a
# silent wrong action. See PENDING_REAL_DEVICE_DATA.md for the tracking
# entry and the recommended first-run procedure (supervised, `--skip-wizard`
# only after wizard screens are actually seen, watch every screenshot).
#
# UPDATE 2026-09-14 (real data starting to come in for THIS unit, serial
# 353681650397052): the first real dump of this device
# (apn_input_dialog_SHG07.xml) confirmed the APN field dialog's structure
# matches what was inherited from SHG10 (android:id/edit,
# android:id/button1/2) — but also surfaced a real, SHG07-specific problem
# inheriting SHG10's values did NOT predict: the active Japanese IME
# interferes with plain alphanumeric field entry here, not just MCC/MNC as
# on SHG10. See `use_keyevent_text_entry` below — this one value is now
# real SHG07 data, not an SHG10 inheritance.
model: "AQUOS sense6s"
model_number: "SHG07"
manufacturer: "SHARP"
android_version: 13

# INHERITED FROM SHG10 (2026-09-14) — see the file-level warning above.
# SHG10's own wizard config is itself photograph-derived (never a real
# dump — structurally impossible, see docs/record.md) and still has 2 of 9
# screens' button labels unconfirmed even on SHG10. For SHG07 specifically,
# Android 13 vs 14 makes the OOBE sequence itself (not just button ids) a
# real open question — screens could be added, removed, or reordered.
# Do NOT run this against a real SHG07 unit unattended; watch every screen
# during the first pass and be ready to interrupt before any unexpected tap.
wizard:
  screens:
    - name: welcome
      identify_by_text: "ようこそ"
      action: tap_by_text
      # TODO(verify-on-device): inherited from SHG10, where this label was
      # never actually confirmed either (illegible in the client's photo).
      target_text: "TODO(verify-on-device)"
    - name: carrier_setup
      identify_by_text: "キャリア設定中"
      action: wait_for_disappear
      timeout_sec: 120
    - name: wifi_connect
      identify_by_text: "Wi-Fiに接続"
      action: tap_by_text
      target_text: "オフラインで設定"
      # CONFIRM WITH CLIENT that the offline path is standard for SHG07 too
      # before relying on this (same caveat as SHG10's own config).
    - name: offline_confirm
      identify_by_text: "オフラインで設定しますか?"
      action: tap_by_text
      target_text: "続行"
      # The OTHER button is 戻る — never tap it (enforced at the
      # ui_automator layer too, see _NEVER_TAP_TEXT).
    - name: continue_setup
      identify_by_text: "セットアップを続けますか?"
      action: tap_by_text
      target_text: "続行"
      # The OTHER button is 中断し、リマインダーを受け取る — never tap it
      # (also enforced at the ui_automator layer).
    - name: google_terms
      identify_by_text: "同意する"
      action: scroll_then_tap_by_text
      target_text: "同意する"
    - name: software_update
      identify_by_text: "ソフトウェア更新について"
      action: tap_by_text
      # TODO(verify-on-device): inherited from SHG10, unconfirmed there too.
      target_text: "TODO(verify-on-device)"
    - name: provisioning
      identify_by_text: "スマートフォンを設定しています"
      action: wait_for_disappear
      timeout_sec: 300
    - name: aquos_notify
      identify_by_text: "AQUOS Homeの通知アクセス"
      action: tap_by_text
      target_text: "OK"
      # Configured *terminal* screen for the wizard walkthrough — see
      # wizard_walkthrough.py's docstring. Whether SHG07 shows the same
      # SHARP-specific dialog at all is unconfirmed.

# INHERITED FROM SHG10 (2026-09-14) — real values for SHG10, unconfirmed
# for SHG07. Wi-Fi Settings resource-ids (android:id/switch_widget,
# android:id/title) are standard AOSP framework ids, which is the most
# likely part of this file to actually carry over unchanged; the intent
# navigation (android.settings.WIFI_SETTINGS) is hardcoded in
# wifi_setup.py, not driven by this file, and is also standard Android
# behavior independent of OEM skin.
wifi_settings:
  menu_path:
    - type: text
      value: "設定"
    - type: text
      value: "ネットワークとインターネット"
    - type: text
      value: "Wi-Fi とモバイルネットワーク"
  toggle_resource_id: "android:id/switch_widget"
  network_list_resource_id: "android:id/title"
  # Still unresolved even on SHG10 itself (no dump of the "Connect to
  # network" dialog exists there either) — kept as the same generic
  # AOSP-style guess, not upgraded to "inherited real value" since SHG10
  # never actually confirmed it.
  password_field_resource_id: "com.android.settings:id/wifi_password"
  connect_button_resource_id: "com.android.settings:id/wifi_connect_button"
  connect_button_text: "接続"

# INHERITED FROM SHG10 (2026-09-14) — converted from this file's previous
# legacy per-field-resource-id shape to SHG10's labeled shape (real fields
# on SHG10 share one generic resource-id disambiguated by label text — see
# sharp_aquos_sense7.yaml and docs/record.md). Unconfirmed for SHG07: if
# SHG07's APN editor turns out to use per-field ids after all (the
# ORIGINAL, pre-2026-09-14 guess for this file), configure_apn() will fail
# loudly at the first field/dialog tap rather than silently proceeding —
# see apn_setup.py's _fill_labeled_field().
apn_settings:
  menu_path:
    - type: text
      value: "設定"
    - type: text
      value: "ネットワークとインターネット"
    - type: text
      value: "Wi-Fi とモバイルネットワーク"
    - type: resource_id
      value: "com.android.settings:id/settings_button"
  field_row_resource_id: "android:id/title"
  name_field_label: "名前"
  apn_field_label: "APN"
  mcc_field_label: "MCC"
  mnc_field_label: "MNC"
  dialog_edit_field_resource_id: "android:id/edit"
  dialog_confirm_button_resource_id: "android:id/button1"
  # RESOLVED (real, tests/fixtures/AQUOS sense6s（SHG07）/apn_input_dialog_
  # SHG07.xml — same dump that confirmed the two ids above): "キャンセル" at
  # android:id/button2, matching SHG10's exact same structure. Added
  # 2026-09-15 so apn_setup.py can back out of a dialog whose typed text
  # didn't commit correctly (see use_keyevent_text_entry below) instead of
  # leaving it open — real finding the same day: a left-open dialog caused
  # every subsequent run/retry to fail navigation too.
  dialog_cancel_button_resource_id: "android:id/button2"
  # INHERITED FROM SHG10, NOT independently confirmed for SHG07 — no
  # SHG07 dump has ever captured the edit-form/list toolbar (both real
  # SHG07 dumps so far only show a field dialog's own window, same
  # "dump only captures the foreground window" limit noted elsewhere).
  # This is the standard AOSP toolbar "navigate up" content-desc though,
  # not a SHARP-specific string, and SHG07's dialog ids have otherwise
  # matched SHG10's exactly — low risk, but unconfirmed. apn_setup.py
  # only uses this as a best-effort cleanup tap (a miss here just logs a
  # warning, never masks the real error it's cleaning up after).
  navigate_up_content_desc: "上へ移動"
  add_button_resource_id: null
  add_button_content_desc: "新しい APN"
  overflow_menu_content_desc: "その他のオプション"
  save_menu_item_text: "保存"
  save_button_resource_id: null
  # REVERTED to unset, 2026-09-15 — round 2 of this investigation
  # (docs/record.md) proved `input_ascii_direct()` (per-keyevent typing)
  # does NOT actually bypass this device's IME for letters either: it
  # produced 「らくてん。」 from "rakuten.jp", the same romaji-to-kana
  # conversion `input_text_direct()` was originally blamed for. Real
  # technical reason both fail identically: `adb shell input text` is
  # itself implemented via synthesized KeyEvents (through
  # KeyCharacterMap), the same underlying mechanism `input keyevent` uses
  # directly — so both are equally subject to whatever mode (kana vs.
  # 英数/alphanumeric) the keyboard is currently in when they're sent, not
  # bypassing it. This strongly suggests SHG10's real 2026-09-11 success
  # with input_text_direct() worked because that unit's keyboard happened
  # to already be in alphanumeric mode at the time — not because that
  # command is immune to conversion — meaning switching *methods* alone
  # doesn't fix this; the keyboard's *current mode* is the real blocker
  # (the visible "あ1"/英数 toggle key, not yet solvable via
  # uiautomator — no resource-id exists for it, see
  # PENDING_REAL_DEVICE_DATA.md). Reverted so SHG07 uses the exact same
  # method as SHG10 for a direct, apples-to-apples real-hardware test of
  # this hypothesis — not yet re-verified.
  # use_keyevent_text_entry: true

  # RESOLVED — real, directly confirmed (2026-09-15), and this IS what
  # actually fixes it (round 6/7 of the SHG07 text-entry investigation,
  # docs/record.md): the on-screen keyboard's かな/英数 mode-toggle key
  # (bottom-left, labelled "あ1"/"A⇔A" depending on state) doesn't appear
  # in any uiautomator dump — confirmed twice, even at the exact moment a
  # screenshot showed it (the IME hides its own UI from accessibility
  # tooling). Its coordinate was found the only reliable way available:
  # Android's Settings > Developer options > Input > "Pointer location",
  # tapped via the real device screen, then re-confirmed via `adb shell
  # input tap 106 2239` specifically (not just manual touch) followed by
  # `adb shell input text "a"` — the field showed a correct half-width
  # "a", not hiragana. Two taps were used in that confirmed test (the
  # toggle key appears to cycle through more than 2 states); apn_setup.py
  # taps it twice before every non-numeric field for the same reason.
  # This coordinate is tied to THIS device's exact screen
  # resolution/orientation — do not copy it to another model without
  # re-confirming on that device.
  keyboard_mode_toggle_tap: [106, 2239]
