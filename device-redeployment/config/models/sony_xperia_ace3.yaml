# Model profile: Xperia Ace III (SOG08), Sony, Android 13
#
# STAGE B (2026-09-16): wifi_settings/apn_settings now hold REAL data,
# captured from actual uiautomator dumps
# (tests/fixtures/Xperia Ace III（SOG08）/*.xml — wifi_list, apn_list,
# apn_entry_{top,middle,bottom}, apn_overflow_menu). See docs/record.md
# and PENDING_REAL_DEVICE_DATA.md for the full account.
#
# wizard_steps below is UNCHANGED Stage A — still 100% invented
# placeholders. No wizard/OOBE data exists or ever will for any model
# (factory reset wipes ADB authorization before the wizard is reachable —
# see docs/record.md's "Wizard capture — RESOLVED AS NOT REMOTELY
# POSSIBLE"), and unlike SHG10 there are no client photos of this
# specific unit's OOBE flow to derive a screen-driven config from either.
model: "Xperia Ace III"
model_number: "SOG08"
manufacturer: "Sony"
android_version: 13

wizard_steps:
  # TODO(real-device): replace with captured resource-id (language select "Next")
  - screen: "language_select"
    resource_id: "com.google.android.setupwizard:id/next_button"
    action: "tap"
  # TODO(real-device): replace with captured resource-id (terms of service accept)
  - screen: "terms_of_service"
    resource_id: "com.android.setupwizard:id/accept_button"
    action: "tap"
  # TODO(real-device): replace with captured resource-id (skip SIM check) and
  # confirm whether this screen actually appears on this model at all.
  - screen: "skip_sim_check"
    resource_id: "com.android.setupwizard:id/skip_button"
    action: "tap"
    optional: true   # not every model shows this screen
  # TODO(real-device): replace with captured resource-id (skip Wi-Fi-during-wizard,
  # if present) — Sony wizards on Android 13 may prompt for Wi-Fi during setup
  # before Phase 2's own wifi_setup step runs; confirm actual screen sequence.
  - screen: "skip_wizard_wifi"
    resource_id: "com.android.setupwizard:id/skip_button"
    action: "tap"
    optional: true
  # TODO(real-device): replace with captured resource-id (final "finish setup")
  - screen: "finish_setup"
    resource_id: "com.android.setupwizard:id/finish_button"
    action: "tap"

# RESOLVED (real: tests/fixtures/Xperia Ace III（SOG08）/wifi_list_SOG08.xml).
# Byte-identical ids to SOG07 and SHG10 (three real devices, two
# manufacturers, two Android versions, same structure) — this is the
# plain, unskinned AOSP com.android.settings Wi-Fi screen. Same confirmed
# difference from SHG10: this screen's title renders via content-desc
# "インターネット", not SHARP's "Wi-Fi とモバイルネットワーク".
wifi_settings:
  menu_path:
    - type: text
      value: "設定"
    - type: text
      value: "インターネット"
  # RESOLVED (real) — same id as SOG07/SHG10, checked="true" in the
  # captured dump.
  toggle_resource_id: "android:id/switch_widget"
  # RESOLVED (real) — generic AOSP list-item title id, shared by every
  # row on this screen. Must always be used with `text=<SSID>` to
  # disambiguate.
  network_list_resource_id: "android:id/title"
  # NOT resolved — no dump of the "Connect to network" dialog exists for
  # this unit either.
  # TODO(real-device): replace with captured resource-id (password entry field
  # in the "Connect to network" dialog)
  password_field_resource_id: "com.android.settings:id/wifi_password"
  # TODO(real-device): replace with captured resource-id (dialog "Connect" button)
  connect_button_resource_id: "com.android.settings:id/wifi_connect_button"
  # INHERITED FROM SHG10, NOT independently confirmed for this unit —
  # same reasoning as SOG07's identical note.
  connect_button_text: "接続"

# RESOLVED (real: tests/fixtures/Xperia Ace III（SOG08）/apn_list_SOG08.xml,
# apn_entry_{top,middle}_SOG08.xml, apn_overflow_menu_SOG08.xml). Every
# id/content-desc/label below is BYTE-IDENTICAL to SHG10's and SOG07's —
# the plain, unskinned AOSP APN editor, confirmed now across 3 real
# devices and 2 manufacturers.
apn_settings:
  # SUPERSEDED (real, 2026-09-18 — see apn_setup.py's _navigate_apn_menu()
  # docstring for the full account): android.settings.APN_SETTINGS
  # reaches a screen that looks like an APN editor but isn't the active
  # SIM's real, live context — first confirmed on SHG07, then directly
  # confirmed on THIS device too via a real dump of its own
  # carrier-specific mobile-network-settings screen,
  # tests/fixtures/Xperia Ace III（SOG08）/mobile_network_SOG08.xml
  # (2026-09-18): "アクセス ポイント名" (WITH a space) is a genuinely
  # real, tappable android:id/title row there, same pattern as SHG07's.
  reach_via_wifi_settings_intent: true
  # menu_path now holds ONLY the steps needed AFTER
  # android.settings.WIFI_SETTINGS reaches "インターネット" (this
  # device's real, confirmed combined Wi-Fi/mobile-network screen title —
  # reach_via_wifi_settings_intent above skips the 設定/インターネット
  # text-tap steps that used to manually re-derive that same screen). The
  # gear icon step was already real/confirmed; the final
  # "アクセス ポイント名" tap is the new step, real and confirmed via the
  # dump referenced above.
  menu_path:
    - type: resource_id
      value: "com.android.settings:id/settings_button"
    - type: text
      value: "アクセス ポイント名"

  # RESOLVED (real). Every field row shares this one generic id,
  # disambiguated only by visible Japanese label.
  field_row_resource_id: "android:id/title"
  name_field_label: "名前"
  apn_field_label: "APN"
  # RESOLVED (real) — MCC/MNC rows exist on this build too (captured
  # showing "未設定"/not-yet-set — a blank entry, not evidence they're
  # absent). MCC must be exactly 3 digits, MNC 2 or 3 — enforced by
  # apn_setup.py before ever touching the device regardless of model.
  mcc_field_label: "MCC"
  mnc_field_label: "MNC"

  # INHERITED FROM SHG10/SHG07/SOG07, NOT independently captured for this
  # unit's own per-field dialog — no dump of it open exists for SOG08.
  # Same well-reasoned-but-unconfirmed status as SOG07's identical note.
  dialog_edit_field_resource_id: "android:id/edit"
  dialog_confirm_button_resource_id: "android:id/button1"
  dialog_cancel_button_resource_id: "android:id/button2"

  # Has no resource-id on this build either — confirmed by the real dump
  # (apn_list_SOG08.xml), not absence of evidence.
  add_button_resource_id: null
  # RESOLVED (real) — "新しい APN", same content-desc as every other
  # device checked so far.
  add_button_content_desc: "新しい APN"

  # RESOLVED (real) — same two-tap overflow-menu save flow as SHG10/SOG07.
  overflow_menu_content_desc: "その他のオプション"
  save_menu_item_text: "保存"
  save_button_resource_id: null

  # RESOLVED (real) — a live run on 2026-09-17 showed the same
  # kana-conversion symptom SHG07 had. Coordinate found and confirmed via
  # Pointer Location + a scripted `adb shell input tap` + text-entry test
  # on this exact unit (client-confirmed, see docs/record.md's SOG08
  # section) — must never be copied to another device/resolution.
  keyboard_mode_toggle_tap: [73, 1352]
  # RESOLVED (real) — apn_list_SOG08.xml shows the identical content-desc
  # "上へ移動" for the toolbar back-arrow.
  navigate_up_content_desc: "上へ移動"
